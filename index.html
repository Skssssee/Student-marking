<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nimo TV Stream Viewer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: Arial, sans-serif;
        }
        
        .video-container {
            width: 90%;
            max-width: 1280px;
            aspect-ratio: 16 / 9;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 8px;
            overflow: hidden;
            background-color: #000;
            position: relative; 
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* --- Real Tracker Badge Styles --- */
        .real-tracker {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 5;
            background: rgba(0, 0, 0, 0.7);
            padding: 5px;
            border-radius: 4px;
            display: none; /* Hidden until Telegram button is clicked */
            align-items: center;
        }
        
        .real-tracker span {
            margin-right: 8px;
            font-size: 14px;
            font-weight: bold;
            color: white;
        }

        /* --- Telegram Overlay Styles --- */
        .telegram-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .telegram-overlay h2 {
            margin-bottom: 10px;
            color: #ffffff;
        }

        .telegram-overlay p {
            color: #aaaaaa;
            margin-bottom: 25px;
        }

        .telegram-btn {
            background-color: #0088cc;
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .telegram-btn:hover {
            background-color: #006699;
        }
    </style>
</head>
<body>

    <div class="video-container">
        
        <div class="real-tracker" id="tracker-badge">
            <span>🔴 Live Views:</span>
            <script id="_wautw3">var _wau = _wau || []; _wau.push(["small", "YOUR_RANDOM_ID_XYZ", "tw3"]);</script>
            <script async src="//waust.at/s.js"></script>
        </div>

        <div class="telegram-overlay" id="tg-overlay">
            <h2>Join Our Telegram to Watch!</h2>
            <p>Click the button below to join our channel. The stream will unlock automatically.</p>
            <a href="https://t.me/+p7Pds5qerMpkYzI1" target="_blank" class="telegram-btn" onclick="unlockStream()">Join Telegram Channel</a>
        </div>

        <iframe 
            src="https://www.nimo.tv/embed/451887506?quality=1080" 
            allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
            allowfullscreen="true"
            webkitallowfullscreen="true"
            mozallowfullscreen="true">
        </iframe>
    </div>

    <script>
        function unlockStream() {
            // Hides the Telegram overlay
            document.getElementById('tg-overlay').style.display = 'none';
            
            // Shows the real live tracker badge
            document.getElementById('tracker-badge').style.display = 'flex';
        }
    </script>

</body>
</html>
