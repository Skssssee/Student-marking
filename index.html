<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nimo TV Stream Viewer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: Arial, sans-serif;
        }
        
        .video-container {
            width: 90%;
            max-width: 1280px;
            aspect-ratio: 16 / 9;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 8px;
            overflow: hidden;
            background-color: #000;
            position: relative; /* Required for overlays */
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* --- Live Viewer Count Styles --- */
        .viewer-count {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            z-index: 5; /* Keeps it above the video */
        }

        .red-dot {
            width: 10px;
            height: 10px;
            background-color: #ff0000;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }

        /* --- Telegram Overlay Styles --- */
        .telegram-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .telegram-overlay h2 {
            margin-bottom: 10px;
            color: #ffffff;
        }

        .telegram-overlay p {
            color: #aaaaaa;
            margin-bottom: 25px;
        }

        .telegram-btn {
            background-color: #0088cc;
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .telegram-btn:hover {
            background-color: #006699;
        }
    </style>
</head>
<body>

    <div class="video-container">
        
        <div class="viewer-count" id="viewer-badge" style="display: none;">
            <div class="red-dot"></div>
            <span id="live-count">1,245</span>&nbsp;Watching
        </div>

        <div class="telegram-overlay" id="tg-overlay">
            <h2>Join Our Telegram to Watch!</h2>
            <p>Click the button below to join our channel. The stream will unlock automatically.</p>
            <a href="https://t.me/+p7Pds5qerMpkYzI1" target="_blank" class="telegram-btn" onclick="unlockStream()">Join Telegram Channel</a>
        </div>

        <iframe 
            src="https://m.nimo.tv/embed/1913320824?af_sub1=default&af_force_deeplink=true&af_dp=nimotv%3A%2F%2Fhuya.nimo.com%2Fliving_room%3Fanchor_id%3D1939515031019%26room_id%3D1913320824&pid=nimo_wap&is_retargeting=true&af_sub4=8&af_sub2=1913320824&af_adset=default&af_ad=8&af_sub3=451887506&c=common_share&referrer=af_tranid%3DhnT_nIMPrAkQeNKtcc1ZLg%26af_sub1%3Ddefault%26af_dp%3Dnimotv%253A%252F%252Fhuya.nimo.com%252Fliving_room%253Fanchor_id%253D1939515031019%2526room_id%253D1913320824%26pid%3Dnimo_wap%26af_ios_url%3Dhttps%3A%2F%2Fm.nimo.tv%2Flive%2F1913320824%26af_sub4%3D8%26af_sub2%3D1913320824%26af_adset%3Ddefault%26af_ad%3D8%26af_sub3%3D451887506%26c%3Dcommon_share%26af_android_url%3Dhttps%3A%2F%2Fm.nimo.tv%2Flive%2F1913320824" 
            allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
            allowfullscreen="true"
            webkitallowfullscreen="true"
            mozallowfullscreen="true">
        </iframe>
    </div>

    <script>
        // 1. Logic to unlock stream and show the live count
        function unlockStream() {
            // Hide the Telegram overlay
            document.getElementById('tg-overlay').style.display = 'none';
            // Show the live viewer count badge
            document.getElementById('viewer-badge').style.display = 'flex';
        }

        // 2. Logic to create a realistic fake viewer count
        let currentViewers = 1245; // Starting number

        setInterval(() => {
            // Randomly add or subtract up to 5 viewers
            const change = Math.floor(Math.random() * 11) - 5; 
            currentViewers += change;

            // Don't let it drop below 1200
            if (currentViewers < 1200) currentViewers = 1205; 

            // Update the HTML
            document.getElementById('live-count').innerText = currentViewers.toLocaleString();
        }, 3000); // Updates every 3 seconds
    </script>

</body>
</html>
